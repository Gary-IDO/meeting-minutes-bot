# 在 GitHub 的 macOS 執行器上建置「未簽章」的 IPA。
# 不需要 Mac、不需要 Apple 開發者帳號或憑證；下載 IPA 後用 Windows 上的 Sideloadly 以自己的 Apple ID 簽章安裝。
name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # 推 tag 時要建立 GitHub Release 附上 IPA

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: MeetingMinutesBot
  SCHEME: MeetingMinutesBot
  # macos-26 映像自 2026-07-21 起預設就是 Xcode 26.6；仍明確指定以免預設版本變動。
  XCODE_APP: /Applications/Xcode_26.6.app
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  build:
    # 公開 repo 免費；私有 repo 每月 2,000 分鐘額度，macOS 以約 10 倍計算（約 200 分鐘）。
    # 不要用 xcode-27（公開預覽、跑在 macOS 27 上）。
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          if [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          else
            echo "::warning::$XCODE_APP not found on this image; using the runner default Xcode"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (Release, device SDK, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/${APP_NAME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::${APP_PATH} not found"
            ls -R build/Build/Products || true
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qr "${APP_NAME}-unsigned.ipa" Payload)
          ls -la build/*.ipa
          # 檢查最低系統版本與可執行檔架構，避免誤產出模擬器版本。
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"
          lipo -info "$APP_PATH/${APP_NAME}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: build/${{ env.APP_NAME }}-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0   # .ipa 本身就是 zip

      # 推 tag（例如 v1.0.0）時，另外建立 GitHub Release 並附上 IPA，下載時不會再被包一層 zip。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APP_NAME }}-unsigned.ipa
          generate_release_notes: true
